<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — Manual do Programador Etecano</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<header class="header">
  <a href="#" class="logo">Etec<span>Ano</span></a>
</header>

<main style="padding:4rem; display:flex; justify-content:center;">
  <section style="width:40rem;">
    <h2 style="text-align:center; margin-bottom:2rem;">Criar conta</h2>
    <form id="register-form">
      <input type="text" id="reg-name" placeholder="Nome" class="box">
      <input type="email" id="reg-email" placeholder="Email" class="box">
      <input type="password" id="reg-pass" placeholder="Senha" class="box">
      <button class="btn" type="submit">Criar conta</button>
    </form>

    <hr style="margin:2rem 0;">

    <h2 style="text-align:center; margin-bottom:2rem;">Login</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Insira seu email" class="box">
      <input type="password" id="login-pass" placeholder="Insira sua senha" class="box">
      <button class="btn" type="submit">Entrar</button>
    </form>

    <p id="msg" style="text-align:center; margin-top:1rem; color:var(--vermelho)"></p>
  </section>
</main>

<script src="js/index.js"></script>
</body>
</html>
